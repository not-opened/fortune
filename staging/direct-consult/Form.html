<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>낫오픈드 무료운세 상담</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#25203a;background:#f8f6ff;font-size:18px;line-height:1.65}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:620px;margin:0 auto;padding:1.5rem 1rem 2.4rem}h1{font-size:1.65rem;line-height:1.25;margin:.25em 0}p{margin:.7em 0}form,section{background:white;padding:clamp(.8rem,4vw,1.5rem);border:1px solid #d9d0eb;border-radius:1rem;margin-top:1rem}label:not(.check),summary{display:block;font-weight:700;margin-top:.85em}input:not([type=checkbox]),select,textarea,button{font:inherit;min-height:50px;width:100%;border-radius:.5rem;padding:.4rem .6rem;border:1px solid #786a8c;background:#fff;color:inherit}textarea{display:block;resize:vertical;min-height:124px}input[type=checkbox]{width:24px;height:24px;margin:.12em .45em 0 0;flex:none}.check{display:flex;align-items:flex-start;margin:.9em 0}.btn{font-weight:720;background:#52378e;color:white;border:1px solid #52378e;margin:.8em 0 0;cursor:pointer}.btn[disabled]{opacity:.58;cursor:wait}.secondary{background:#fff;color:#402a71}.hint{font-size:.94em;color:#514667}.err{color:#81243a;font-weight:650}.hp{position:absolute!important;left:-10000px;width:1px;height:1px;overflow:hidden}[tabindex="-1"]:focus{outline:0}:focus-visible{outline:3px solid #7148c0;outline-offset:3px}details{margin:.8em 0}h2{font-size:1.25rem}
</style></head><body><main>
<h1>무료운세 상담</h1><p>궁금한 한 가지를 적어 주세요. 메일 앱에서 직접 보낼 필요 없이 여기서 신청할 수 있어요.</p>
<noscript><p>신청하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
<form id="intake" hidden>
<div id="entry"><label for="email">답변 받을 이메일</label><input id="email" type="email" autocomplete="email" spellcheck="false" maxlength="254" required>
<label for="topic">상담 주제 <span class="hint">(선택)</span></label>
<select id="topic"><option value="기타">기타 / 잘 모르겠어요</option><option>직장·진로</option><option>연애·관계</option><option>가족·일상</option><option>새해·계획</option></select>
<label for="question">궁금한 점 한 가지</label><textarea id="question" maxlength="500" required aria-describedby="question-help"></textarea>
<p class="hint" id="question-help">500자까지 쓸 수 있어요. 다른 사람의 연락처나 민감한 정보는 적지 말아 주세요.</p>
<details><summary>생년월일·태어난 시간 (선택)</summary>
<label for="birth">생년월일</label><input id="birth" type="date" min="1900-01-01">
<label for="calendar">달력 기준</label><select id="calendar"><option>모름</option><option>양력</option><option>음력</option></select>
<label for="time">태어난 시간</label><input id="time" type="time"></details>
<div class="hp" aria-hidden="true"><label for="hp">비워 두세요</label><input id="hp" tabindex="-1" autocomplete="off"></div>
<label class="check"><input id="consent" type="checkbox" required><span>신청 정보가 답변 작성 및 이메일 회신에 사용되며, 답변은 AI가 작성하는 참고용 풀이임을 확인했어요.</span></label>
<p class="hint">답변까지 시간이 걸릴 수 있어요.</p>
<button id="begin" class="btn" type="submit">상담 신청하기</button></div>
<div id="verify" hidden><h2 id="verify-title" tabindex="-1">이메일 확인번호를 입력해 주세요</h2>
<p>적어 주신 이메일로 확인번호 6자리를 보냈어요. 메일이 안 보이면 스팸함도 확인해 주세요.</p>
<label for="code">이메일 확인번호 6자리</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
<button id="finish" type="submit" class="btn">확인하고 접수하기</button><button id="change" type="button" class="btn secondary">이메일 주소 수정</button></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
<section id="success" hidden><h2 id="success-title" tabindex="-1">접수됐어요</h2><p>답변은 입력하신 이메일로 보내드려요. 답변까지 시간이 걸릴 수 있어요.</p><p>접수번호: <strong id="receipt"></strong></p></section>
</main><script>
(() => {
const $=x=>document.getElementById(x), f=$('intake'), fields=$('entry'), verify=$('verify'), box=$('status'), code=$('code');
$('birth').max=new Date(Date.now()+9*3600000).toISOString().slice(0,10);
let request=null, ticket='', busy=false;
function show(t,error=false){box.textContent=t;box.className=error?'err':'';}
function loading(b){busy=b;for(const id of ['begin','finish','change'])$(id).disabled=b;}
function failed(){loading(false);show('연결이 끊겼어요. 접수 여부를 아직 확인하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true);}
function back(){ticket='';code.value='';code.required=false;verify.hidden=true;fields.hidden=false;show('');$('email').focus();}
$('change').addEventListener('click',back);
f.addEventListener('submit',e=>{
  e.preventDefault();
  if(busy) return;
  if(!ticket){
    if(!$('question').value.trim()){show('궁금한 점을 적어 주세요.',true);$('question').focus();return;}
    request={email:$('email').value.trim(),topic:$('topic').value,question:$('question').value.trim(),birth:$('birth').value,time:$('time').value,calendar:$('calendar').value,consent:$('consent').checked,trap:$('hp').value};
    loading(true);show('이메일 확인번호를 보내는 중이에요.');
    google.script.run.withFailureHandler(failed).withSuccessHandler(r=>{
      loading(false);
      if(r.status==='code'){ticket=r.id;fields.hidden=true;verify.hidden=false;code.required=true;show('');$('verify-title').focus();}
      else show(r.status==='limited'?'이메일 확인 요청이 너무 많아요. 이미 확인번호를 받았다면 그 화면을 확인해 주세요.':'확인번호를 보내지 못했어요. 이메일 주소를 확인해 주세요.',true);
    }).beginConsult(request.email,request.trap);
  }else{
    loading(true);show('접수하는 중이에요.');
    google.script.run.withFailureHandler(failed).withSuccessHandler(r=>{
      loading(false);
      if(r.status==='accepted' && /^N[A-F0-9]{12}$/.test(r.receipt)){
        f.reset();request=null;ticket='';f.hidden=true;show('');$('receipt').textContent=r.receipt;$('success').hidden=false;$('success-title').focus();
      } else show(r.status==='wrong'?'확인번호가 맞지 않아요. 이메일에 적힌 번호를 다시 확인해 주세요.':r.status==='expired'?'확인번호 사용 시간이 지났어요. 아직 접수되지 않았어요.':'아직 접수 완료를 확인하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true);
    }).finishConsult({...request,id:ticket,code:code.value});
  }
});
f.hidden=false;
})();
</script></body></html>
